{% extends "base.html" %}

{% block head %}
<style>
  .admin-section {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .admin-section h2 {
    margin: 0 0 1rem;
    font-size: 1.1rem;
    font-weight: 600;
  }

  .admin-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .admin-actions button {
    font-size: 0.85rem;
    padding: 0.4rem 0.75rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
    color: #fff;
  }

  .btn-trigger { background: #2563eb; }
  .btn-trigger:hover { background: #1d4ed8; }
  .btn-requeue { background: #dc2626; }
  .btn-requeue:hover { background: #b91c1c; }

  .admin-links {
    list-style: none;
    padding: 0;
    margin: 1rem 0 0;
  }

  .admin-links li {
    margin-bottom: 0.5rem;
  }

  .admin-links a {
    color: #2563eb;
    text-decoration: none;
    font-size: 0.9rem;
  }

  .admin-links a:hover {
    text-decoration: underline;
  }

  .status-msg {
    margin-top: 0.75rem;
    font-size: 0.85rem;
    color: #065f46;
    display: none;
  }

  .status-msg.visible {
    display: block;
  }

  .status-msg.error {
    color: #991b1b;
  }
</style>
{% endblock %}

{% block content %}
<div class="admin-section">
  <h2>Extraction Control</h2>
  <div class="admin-actions">
    <button type="button" class="btn-trigger" id="btnTrigger">Trigger All Pending</button>
    <button type="button" class="btn-requeue" id="btnRequeue">Re-queue All Failed</button>
  </div>
  <div class="status-msg" id="statusMsg"></div>
</div>

<ul class="admin-links">
  <li><a href="/admin">&larr; Go to main admin page</a></li>
</ul>

<script>
(function() {
  var statusMsg = document.getElementById('statusMsg');

  function showMsg(text, isError) {
    statusMsg.textContent = text;
    statusMsg.className = 'status-msg visible' + (isError ? ' error' : '');
    setTimeout(function() { statusMsg.className = 'status-msg'; }, 4000);
  }

  // Trigger All Pending
  document.getElementById('btnTrigger').addEventListener('click', function() {
    var baseUrl = '{{ event_base_url|default("", true) }}';
    fetch(baseUrl + '/api/admin/trigger', { method: 'POST' })
      .then(function(res) { return res.json(); })
      .then(function(data) { showMsg('Dispatched ' + data.dispatched + ' record(s).', false); })
      .catch(function() { showMsg('Network error.', true); });
  });

  // Re-queue All Failed
  document.getElementById('btnRequeue').addEventListener('click', function() {
    var baseUrl = '{{ event_base_url|default("", true) }}';
    fetch(baseUrl + '/api/admin/requeue', { method: 'POST' })
      .then(function(res) { return res.json(); })
      .then(function(data) { showMsg('Re-queued ' + data.requeued + ' record(s).', false); })
      .catch(function() { showMsg('Network error.', true); });
  });
})();
</script>
{% endblock %}
